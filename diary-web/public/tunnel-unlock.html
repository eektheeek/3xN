<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Подтверждение туннеля</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1c1c1e;
        background: #f5f5f7;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
      }
      .card {
        max-width: 22rem;
        background: #fff;
        border-radius: 12px;
        padding: 1.25rem;
        border: 1px solid #e5e5ea;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
      }
      p {
        margin: 0 0 0.75rem;
        color: #6c6c70;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 1rem;
        border-radius: 10px;
        background: #007aff;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .muted {
        margin-top: 0.85rem;
        margin-bottom: 0;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Туннель открыт</h1>
      <p>
        Если ты только что нажал Visit Site — доступ сохранён для этой иконки. Можно вернуться в
        приложение.
      </p>
      <a id="back" href="/">Открыть приложение</a>
      <p class="muted" id="status">Проверяю /healthz…</p>
    </div>
    <script>
      (async () => {
        const status = document.getElementById('status');
        try {
          const res = await fetch('/healthz', {
            headers: { 'ngrok-skip-browser-warning': 'true' },
            cache: 'no-store',
          });
          const text = await res.text();
          if (!res.ok) throw new Error('healthz ' + res.status);
          JSON.parse(text);
          status.textContent = 'API отвечает — возвращаю в приложение…';
          location.replace('/');
        } catch {
          status.textContent =
            'Если снова видишь Visit Site — нажми кнопку там, затем «Открыть приложение».';
        }
      })();
    </script>
  </body>
</html>
